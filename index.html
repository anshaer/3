<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>3D 壓克力磚展示 (背景透明)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #container {
      width: 80vw;
      height: 80vh;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const params = {
      margin: 12, smooth: 3, alphaCutoff: 20,
      frontThickness: 0.15, backThickness: 0.3, bevel: 0.02,
      transmission: 1, roughness: 0,
      backMode: 'mirror', backSolidColor: '#c53030',
      scale: 1, offX: 0, offY: 0
    };

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const d1 = new THREE.DirectionalLight(0xffffff, 2.0); d1.position.set(5, 8, 5); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 1.5); d2.position.set(-5, -5, -5); scene.add(d2);

    const imgFront = new Image();
    imgFront.src = "./image_front.png";
    imgFront.onload = () => {
      if (false) {
        const imgBack = new Image();
        imgBack.src = "./image_back.png";
        imgBack.onload = () => buildModel(imgFront, imgBack);
      } else {
        buildModel(imgFront, null);
      }
    };

    function generateShape(img, margin, alphaCutoff, smoothIterations) {
      const aspect = img.width / img.height;
      let maxDim = 4.0;
      let w = aspect >= 1 ? maxDim : maxDim * aspect;
      let h = aspect >= 1 ? maxDim / aspect : maxDim;

      const scale = 512 / Math.max(img.width, img.height);
      const cw = Math.round(img.width * scale);
      const ch = Math.round(img.height * scale);

      const canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);

      const data = ctx.getImageData(0, 0, cw, ch).data;
      const grid = new Uint8Array(cw * ch);
      for (let i = 0; i < cw * ch; i++) grid[i] = data[i * 4 + 3] >= alphaCutoff ? 1 : 0;

      const dilated = new Uint8Array(cw * ch);
      const r = Math.round(margin);
      if (r <= 0) dilated.set(grid);
      else {
        for (let y = 0; y < ch; y++) {
          for (let x = 0; x < cw; x++) {
            if (grid[y * cw + x] === 1) {
              for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                  if (dx * dx + dy * dy <= r * r) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < cw && ny >= 0 && ny < ch) dilated[ny * cw + nx] = 1;
                  }
                }
              }
            }
          }
        }
      }

      let points = [], startX = -1, startY = -1;
      outer: for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          if (dilated[y * cw + x] === 1) { startX = x; startY = y; break outer; }
        }
      }

      if (startX === -1) {
        const shape = new THREE.Shape();
        shape.moveTo(-w/2, -h/2); shape.lineTo(w/2, -h/2); shape.lineTo(w/2, h/2); shape.lineTo(-w/2, h/2);
        return { shape, width: w, height: h };
      }

      let currX = startX, currY = startY, dir = 0;
      const dxArr = [1, 1, 0, -1, -1, -1, 0, 1];
      const dyArr = [0, 1, 1, 1, 0, -1, -1, -1];
      const visited = new Set();
      let maxSteps = cw * ch;

      while (maxSteps-- > 0) {
        points.push({ x: currX, y: currY });
        const key = `${currX},${currY}`;
        if (visited.has(key) && points.length > 10 && Math.abs(currX - startX) <= 1 && Math.abs(currY - startY) <= 1) break;
        visited.add(key);
        let found = false, checkDir = (dir + 6) % 8;
        for (let i = 0; i < 8; i++) {
          const d = (checkDir + i) % 8;
          const nx = currX + dxArr[d], ny = currY + dyArr[d];
          if (nx >= 0 && nx < cw && ny >= 0 && ny < ch && dilated[ny * cw + nx] === 1) {
            currX = nx; currY = ny; dir = d; found = true; break;
          }
        }
        if (!found) break;
      }

      let smoothed = points;
      for (let s = 0; s < smoothIterations; s++) {
        let temp = [];
        for (let i = 0; i < smoothed.length; i++) {
          let p0 = smoothed[i], p1 = smoothed[(i + 1) % smoothed.length];
          temp.push({ x: 0.75 * p0.x + 0.25 * p1.x, y: 0.75 * p0.y + 0.25 * p1.y });
          temp.push({ x: 0.25 * p0.x + 0.75 * p1.x, y: 0.25 * p0.y + 0.75 * p1.y });
        }
        smoothed = temp;
      }

      const shape = new THREE.Shape();
      smoothed.forEach((p, idx) => {
        const u = p.x / cw, v = 1.0 - (p.y / ch);
        const x3d = (u - 0.5) * w, y3d = (v - 0.5) * h;
        if (idx === 0) shape.moveTo(x3d, y3d);
        else shape.lineTo(x3d, y3d);
      });
      return { shape, width: w, height: h };
    }

    function buildModel(frontImg, backImg) {
      const { shape, width, height } = generateShape(frontImg, params.margin, params.alphaCutoff, params.smooth);
      const group = new THREE.Group();
      const totalThickness = params.frontThickness + params.backThickness;

      const acrylicGeo = new THREE.ExtrudeGeometry(shape, {
        steps: 1, depth: totalThickness, bevelEnabled: params.bevel > 0,
        bevelThickness: params.bevel, bevelSize: params.bevel, bevelSegments: 4
      });
      acrylicGeo.center();

      const acrylicMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transmission: params.transmission, opacity: 1.0, transparent: true,
        roughness: params.roughness, metalness: 0, ior: 1.491, thickness: totalThickness,
        specularIntensity: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.0, depthWrite: false, side: THREE.DoubleSide
      });
      const acrylicMesh = new THREE.Mesh(acrylicGeo, acrylicMat);
      acrylicMesh.renderOrder = 4;
      group.add(acrylicMesh);

      const zCenterOffset = (params.frontThickness - params.backThickness) / 2;
      const imgGeo = new THREE.PlaneGeometry(width, height);

      const texture = new THREE.Texture(frontImg);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;

      const frontMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: true, side: THREE.FrontSide });
      const frontMesh = new THREE.Mesh(imgGeo, frontMat);
      frontMesh.position.z = zCenterOffset + 0.001;
      frontMesh.renderOrder = 3;
      group.add(frontMesh);

      // 白墨
      const wCanvas = document.createElement('canvas');
      wCanvas.width = frontImg.width; wCanvas.height = frontImg.height;
      const wCtx = wCanvas.getContext('2d');
      wCtx.drawImage(frontImg, 0, 0);
      const wData = wCtx.getImageData(0, 0, frontImg.width, frontImg.height);
      for (let i = 0; i < wData.data.length; i += 4) {
        if (wData.data[i + 3] > 20) { wData.data[i]=255; wData.data[i+1]=255; wData.data[i+2]=255; wData.data[i+3]=255; }
        else wData.data[i+3] = 0;
      }
      wCtx.putImageData(wData, 0, 0);
      const whiteTex = new THREE.CanvasTexture(wCanvas);
      whiteTex.colorSpace = THREE.SRGBColorSpace;
      whiteTex.needsUpdate = true;

      const whiteMat = new THREE.MeshBasicMaterial({ map: whiteTex, transparent: true, depthWrite: true, side: THREE.DoubleSide });
      const whiteMesh = new THREE.Mesh(imgGeo, whiteMat);
      whiteMesh.position.z = zCenterOffset;
      whiteMesh.renderOrder = 2;
      group.add(whiteMesh);

      let backTex;
      if (params.backMode === 'color') {
        const bCanvas = document.createElement('canvas');
        bCanvas.width = frontImg.width; bCanvas.height = frontImg.height;
        const bCtx = bCanvas.getContext('2d');
        bCtx.drawImage(frontImg, 0, 0);
        const bData = bCtx.getImageData(0, 0, frontImg.width, frontImg.height);
        const c = new THREE.Color(params.backSolidColor);
        const r = Math.round(c.r*255), g = Math.round(c.g*255), b = Math.round(c.b*255);
        for (let i = 0; i < bData.data.length; i += 4) {
          if (bData.data[i + 3] > 20) { bData.data[i]=r; bData.data[i+1]=g; bData.data[i+2]=b; bData.data[i+3]=255; }
          else bData.data[i+3] = 0;
        }
        bCtx.putImageData(bData, 0, 0);
        backTex = new THREE.CanvasTexture(bCanvas);
      } else if (params.backMode === 'custom' && backImg) {
        const bCanvas = document.createElement('canvas');
        bCanvas.width = frontImg.width; bCanvas.height = frontImg.height;
        const bCtx = bCanvas.getContext('2d');
        const bw = frontImg.width * params.scale;
        const bh = (frontImg.width * (backImg.height / backImg.width)) * params.scale;
        const bx = (frontImg.width - bw) / 2 + (params.offX * frontImg.width);
        const by = (frontImg.height - bh) / 2 - (params.offY * frontImg.height);
        bCtx.drawImage(backImg, bx, by, bw, bh);

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = frontImg.width; tempCanvas.height = frontImg.height;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(frontImg, 0, 0);
        const fPixels = tCtx.getImageData(0, 0, frontImg.width, frontImg.height).data;
        const bPixels = bCtx.getImageData(0, 0, frontImg.width, frontImg.height);
        for (let i = 0; i < bPixels.data.length; i += 4) {
          if (fPixels[i + 3] <= 20) bPixels.data[i + 3] = 0;
        }
        bCtx.putImageData(bPixels, 0, 0);
        backTex = new THREE.CanvasTexture(bCanvas);
      } else {
        backTex = new THREE.Texture(frontImg);
      }
      backTex.colorSpace = THREE.SRGBColorSpace;
      backTex.needsUpdate = true;

      const backMat = new THREE.MeshBasicMaterial({ map: backTex, transparent: true, depthWrite: true, side: THREE.BackSide });
      const backMesh = new THREE.Mesh(imgGeo, backMat);
      backMesh.position.z = zCenterOffset - 0.001;
      backMesh.renderOrder = 1;
      group.add(backMesh);

      scene.add(group);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
